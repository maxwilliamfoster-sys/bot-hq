name: Trend collector

# Daily: fetch the free trend sources, build niche-gated candidates, write a report and send them to Bot HQ.
# Sending is off until the repository variable TRENDS_POST is "on" (set it once the Worker with migrations
# 0004-0006 is deployed). Until then it is a dry run; the report is the same either way.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: trends
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the collector
        run: python -m unittest discover -s trends/tests -t .
      # Day counts and earlier view readings between runs. Losing them is harmless.
      - uses: actions/cache@v4
        with:
          path: trends/.state
          key: trends-state-${{ github.run_id }}
          restore-keys: trends-state-
      # APP_URL and the token also let the collector read the competitor watchlist (GET /api/trends/context).
      - name: Collect
        env:
          YT_TREND_API_KEY: ${{ secrets.YT_TREND_API_KEY }}
          APP_URL: https://bot-hq.maxwilliamfoster.workers.dev
          APP_EVENTS_TOKEN: ${{ secrets.APP_EVENTS_TOKEN }}
          TRENDS_POST: ${{ vars.TRENDS_POST }}
        run: |
          if [ "$TRENDS_POST" = "on" ]; then python -m trends.collect --post; else python -m trends.collect; fi
      - name: Report
        if: always()
        run: test -f trends/out/report.md && cat trends/out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trends-report
          path: trends/out/
          retention-days: 14
